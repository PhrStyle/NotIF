<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ screen.name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #000;
            color: white;
        }

        .main-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .display-area {
            {% if screen.temRodape %}
            height: 85%;
            {% else %}
            height: 100%;
            {% endif %}
            display: flex;
        }

        .side-display {
            width: 50%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }

        .left-side {
            border-right: 2px solid #333;
        }

        .media-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .footer {
            {% if screen.temRodape %}
            height: 15%;
            display: flex;
            {% else %}
            display: none;
            {% endif %}
            background: #222;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-size: 24px;
            text-align: center;
        }

        .no-media {
            color: #666;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <audio id="radioPlayer" autoplay loop preload="auto">
      <source src="http://sv13.hdradios.net:6990/;" type="audio/mpeg">
    </audio>

    <div class="main-container">
        <div class="display-area">
            <!-- Lado esquerdo -->
            <div class="side-display left-side" id="left-display">
                {% if left_files %}
                    <div class="no-media">Carregando mídia...</div>
                {% else %}
                    <div class="no-media">Nenhuma mídia configurada</div>
                {% endif %}
            </div>

            <!-- Lado direito -->
            <div class="side-display" id="right-display">
                {% if right_files %}
                    <div class="no-media">Carregando mídia...</div>
                {% else %}
                    <div class="no-media">Nenhuma mídia configurada</div>
                {% endif %}
            </div>
        </div>

        {% if screen.temRodape %}
        <div class="footer">
            {{ screen.footer_text if screen.footer_text else "Rodapé da tela" }}
        </div>
        {% endif %}
    </div>

    <script>
        // Dados das mídias
        const leftFiles = {{ left_files|tojson|safe }};
        const rightFiles = {{ right_files|tojson|safe }};

        let leftIndex = 0;
        let rightIndex = 0;
        let leftTimer, rightTimer;

        // Controle de áudio para vídeos simultâneos
        let leftVideoElement = null;
        let rightVideoElement = null;
        let audioQueue = [];
        let currentPlayingAudio = null;

        // Controle da rádio
        const radioPlayer = document.getElementById('radioPlayer');
        let radioPlaying = false;

        // Verificação periódica dos vídeos
        let videoCheckInterval;

        // Funções para controlar a rádio
        function startRadio() {
            if (!radioPlaying) {
                radioPlayer.play().then(() => {
                    radioPlaying = true;
                    console.log('Rádio iniciada');
                }).catch(e => {
                    console.log('Erro ao iniciar rádio:', e);
                });
            }
        }

        function stopRadio() {
            if (radioPlaying) {
                radioPlayer.pause();
                radioPlaying = false;
                console.log('Rádio pausada');
            }
        }

        // Verificar se os vídeos estão tocando
        function checkVideoStatus() {
            let shouldAdvance = false;

            // Verificar lado esquerdo
            if (leftVideoElement && leftFiles.length > 0) {
                const currentFile = leftFiles[leftIndex];
                if (currentFile && currentFile.is_video) {
                    if (leftVideoElement.paused && leftVideoElement.currentTime === 0 && leftVideoElement.readyState >= 2) {
                        console.log('Vídeo esquerdo não está tocando - avançando');
                        shouldAdvance = true;
                        nextLeftMedia();
                    } else if (leftVideoElement.paused && leftVideoElement.currentTime > 0) {
                        // Vídeo pausou no meio - tentar reproduzir
                        leftVideoElement.play().catch(e => {
                            console.log('Erro ao tentar reproduzir vídeo esquerdo:', e);
                            nextLeftMedia();
                        });
                    }
                }
            }

            // Verificar lado direito
            if (rightVideoElement && rightFiles.length > 0) {
                const currentFile = rightFiles[rightIndex];
                if (currentFile && currentFile.is_video) {
                    if (rightVideoElement.paused && rightVideoElement.currentTime === 0 && rightVideoElement.readyState >= 2) {
                        console.log('Vídeo direito não está tocando - avançando');
                        shouldAdvance = true;
                        nextRightMedia();
                    } else if (rightVideoElement.paused && rightVideoElement.currentTime > 0) {
                        // Vídeo pausou no meio - tentar reproduzir
                        rightVideoElement.play().catch(e => {
                            console.log('Erro ao tentar reproduzir vídeo direito:', e);
                            nextRightMedia();
                        });
                    }
                }
            }

            if (shouldAdvance) {
                console.log('Vídeos verificados - alguns foram avançados');
            }
        }

        // Iniciar verificação periódica
        function startVideoCheck() {
            if (videoCheckInterval) {
                clearInterval(videoCheckInterval);
            }
            videoCheckInterval = setInterval(checkVideoStatus, 10000); // A cada 10 segundos
            console.log('Verificação periódica de vídeos iniciada');
        }

        function displayMedia(files, container, index, side) {
            if (!files || files.length === 0) return;

            const file = files[index];
            const mediaPath = `/static/files/${file.file_name}`;

            let mediaElement;
            if (file.is_video) {
                mediaElement = document.createElement('video');
                mediaElement.src = mediaPath;
                mediaElement.className = 'media-content';
                mediaElement.autoplay = true;

                // Configurar áudio
                if (file.has_audio) {
                    mediaElement.muted = false;
                } else {
                    mediaElement.muted = true;
                }

                // Armazenar referência do vídeo
                if (side === 'left') {
                    leftVideoElement = mediaElement;
                } else {
                    rightVideoElement = mediaElement;
                }

                // Quando o vídeo começar a tocar
                mediaElement.addEventListener('playing', () => {
                    if (file.has_audio) {
                        currentPlayingAudio = mediaElement;
                        stopRadio();
                        console.log('Vídeo com áudio iniciou - rádio pausada');
                    }
                });

                // Quando o vídeo terminar
                mediaElement.addEventListener('ended', () => {
                    // Se tinha áudio, limpar referência e verificar se deve reiniciar rádio
                    if (file.has_audio && currentPlayingAudio === mediaElement) {
                        currentPlayingAudio = null;
                        console.log('Vídeo com áudio terminou - verificando rádio');

                        // Aguardar um pouco e verificar se deve reiniciar rádio
                        setTimeout(() => {
                            if (!currentPlayingAudio) {
                                startRadio();
                            }
                        }, 1000);
                    }

                    // Avançar para próxima mídia
                    if (side === 'left') {
                        nextLeftMedia();
                    } else {
                        nextRightMedia();
                    }
                });

            } else {
                mediaElement = document.createElement('img');
                mediaElement.src = mediaPath;
                mediaElement.className = 'media-content';
            }

            // Limpar container e adicionar nova mídia
            container.innerHTML = '';
            container.appendChild(mediaElement);
        }

        function nextLeftMedia() {
            if (leftFiles.length === 0) return;

            clearTimeout(leftTimer);
            leftIndex = (leftIndex + 1) % leftFiles.length;
            displayMedia(leftFiles, document.getElementById('left-display'), leftIndex, 'left');

            // Se não for vídeo, definir timer de 15 segundos
            const currentFile = leftFiles[leftIndex];
            if (!currentFile.is_video) {
                leftTimer = setTimeout(nextLeftMedia, 15000);
            }
        }

        function nextRightMedia() {
            if (rightFiles.length === 0) return;

            clearTimeout(rightTimer);
            rightIndex = (rightIndex + 1) % rightFiles.length;
            displayMedia(rightFiles, document.getElementById('right-display'), rightIndex, 'right');

            // Se não for vídeo, definir timer de 15 segundos
            const currentFile = rightFiles[rightIndex];
            if (!currentFile.is_video) {
                rightTimer = setTimeout(nextRightMedia, 15000);
            }
        }

        // Inicializar displays
        if (leftFiles.length > 0) {
            displayMedia(leftFiles, document.getElementById('left-display'), 0, 'left');
            if (!leftFiles[0].is_video) {
                leftTimer = setTimeout(nextLeftMedia, 15000);
            }
        }

        if (rightFiles.length > 0) {
            // Se o primeiro arquivo da esquerda é um vídeo com áudio, atrasar o da direita
            const leftHasAudio = leftFiles.length > 0 && leftFiles[0].is_video && leftFiles[0].has_audio;

            if (leftHasAudio && rightFiles[0].is_video && rightFiles[0].has_audio) {
                // Aguardar um pouco para o vídeo da esquerda iniciar primeiro
                setTimeout(() => {
                    displayMedia(rightFiles, document.getElementById('right-display'), 0, 'right');
                }, 100);
            } else {
                displayMedia(rightFiles, document.getElementById('right-display'), 0, 'right');
            }

            if (!rightFiles[0].is_video) {
                rightTimer = setTimeout(nextRightMedia, 15000);
            }
        }

        // Inicializar rádio após um tempo
        setTimeout(() => {
            radioPlaying = true; // Marcar como tocando pois tem autoplay
            console.log('Rádio iniciada automaticamente');
        }, 1000);

        // Iniciar verificação periódica
        startVideoCheck();
    </script>
</body>
</html>
