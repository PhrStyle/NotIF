<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NOTIF{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #f8f9fb;
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            z-index: 1000;
        }

        .sidebar .nav-link {
            color: #adb5bd;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #495057;
        }

        .sidebar .nav-link:hover {
            color: #fff;
            background: #495057;
        }

        .sidebar .nav-link.active {
            color: #fff;
            background: #007bff;
        }

        .main-content {
            margin-left: 200px;
            padding: 2rem;
        }

        .brand {
            color: #fff !important;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 2rem 0;
            border-bottom: 1px solid #495057;
            text-decoration: none;
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <a href="#" class="brand d-block">
            <i class="fas fa-tv me-2"></i>NOTIF
        </a>
        <nav class="nav flex-column">
            <a href="/vertelas" class="nav-link {% if request.endpoint == 'screens_bp.ver_telas' %}active{% endif %}">
                <i class="fas fa-list me-2"></i>Listar Telas
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
